workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: MiFaceStudio.xcodeproj
        XCODE_SCHEME: MiFaceStudio
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Generate Xcode project
        script: |
          cd App
          xcodegen generate --spec project.yml
          ls -la
      - name: Set build number
        script: |
          cd App
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" MiFaceStudio/Info.plist || true
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Resolve Swift packages
        script: |
          cd App
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build unsigned app
        script: |
          cd App
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: Package unsigned IPA
        script: |
          APP="$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/MiFaceStudio.app"
          if [ ! -d "$APP" ]; then
            echo "App bundle not found: $APP"
            find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 2 -type d -name '*.app'
            exit 1
          fi
          rm -rf "$CM_BUILD_DIR/unsigned"
          mkdir -p "$CM_BUILD_DIR/unsigned/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/unsigned/Payload/"
          cd "$CM_BUILD_DIR/unsigned"
          zip -qry "$CM_BUILD_DIR/MiFaceStudio-unsigned.ipa" Payload
          ls -lh "$CM_BUILD_DIR/MiFaceStudio-unsigned.ipa"
      - name: Verify package
        script: |
          unzip -l "$CM_BUILD_DIR/MiFaceStudio-unsigned.ipa" | head -20
          echo "Unsigned IPA is ready: $CM_BUILD_DIR/MiFaceStudio-unsigned.ipa"
    artifacts:
      - $CM_BUILD_DIR/MiFaceStudio-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
